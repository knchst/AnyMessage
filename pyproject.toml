[project]
name = "anymessage"
version = "0.2.0"
description = "Read-only local MCP access to macOS messaging applications, starting with WeChat."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "tools/wechat-bootstrap/LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["mcp==1.30.0", "zstandard>=0.23,<1", "tomlkit>=0.13,<1"]

[project.scripts]
anymessage = "anymessage.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/anymessage"]

[tool.hatch.build.targets.wheel.force-include]
"tools/wechat-bootstrap" = "anymessage/vendor/wechat-bootstrap"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/docs",
    "/examples",
    "/tools/wechat-bootstrap",
    "/.github",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/.gitignore",
]

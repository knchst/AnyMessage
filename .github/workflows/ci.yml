name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.3"
      - name: Install SQLCipher
        run: brew install sqlcipher
      - name: Test, audit, and smoke-test Python 3.11 and 3.13
        run: |
          for python_version in 3.11 3.13; do
            uv python install "$python_version"
            uv sync --locked --python "$python_version" --group dev
            uv run --frozen pytest -q
            uv run --frozen python scripts/check_publication.py --history
            uv build --python "$python_version"
            uv run --frozen python scripts/check_publication.py --archive dist/*.whl dist/*.tar.gz
            wheel_env="$RUNNER_TEMP/anymessage-wheel-$python_version"
            uv venv "$wheel_env" --python "$python_version"
            uv pip install --python "$wheel_env/bin/python" dist/*.whl
            checkout="$PWD"
            (
              cd "$RUNNER_TEMP"
              "$wheel_env/bin/anymessage" --help
              "$wheel_env/bin/python" "$checkout/scripts/check_installed.py"
            )
          done
